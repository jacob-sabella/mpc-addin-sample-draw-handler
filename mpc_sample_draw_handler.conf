# mpc-addin-sample-draw-handler settings (key=value; this file sits next to mpc_sample_draw_handler.so)
# enabled=0 leaves the addin loaded but idle: no plugin can draw, MPC's screen is untouched.
enabled=1
# The control interface (status, grant, release, test pattern). 127.0.0.1 is the device itself: reach it from a computer
# through an SSH tunnel (ssh -L 6740:127.0.0.1:6740 root@<device address>). There is no login.
bind=127.0.0.1
port=6740
