# mpc-addin-sample-draw-handler settings (key=value; this file sits next to mpc_sample_draw_handler.so)
# enabled=0 leaves the addin loaded but idle: nothing can draw, MPC's screen is untouched.
enabled=1
# The control interface (status, grant, release, test pattern). 127.0.0.1 is the device itself: reach it from a computer
# through an SSH tunnel (ssh -L 6740:127.0.0.1:6740 root@<device address>). There is no login.
bind=127.0.0.1
port=6740
# The page button: a long hold of this control-surface note cycles the screen (MPC -> each client that can draw, plugin or addin -> MPC).
# The hold never reaches MPC; a short press does, when the button is let go. 1 is PAD FX on the MPC Sample (0 is KNOB FX). -1: no button.
page_note=1
page_hold_ms=800
# the page a long hold opens and closes: RACK (the sample-rack addin's manager). A page it opened goes back to it.
# Without that page open, or with page_home=-, a long hold cycles MPC -> each page in turn -> MPC.
page_home=RACK
# log_buttons=1 logs every button press to MPC's journal (journalctl -u ac50): to find a button's note. 2 also logs the raw bytes.
log_buttons=1
